name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Pytest
        working-directory: backend
        run: pytest -q

      - name: Import the app the way the container does
        working-directory: backend
        run: python -c "import app.main; print('routes:', len(app.main.app.routes))"

  image:
    name: Backend image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -f backend/Dockerfile -t beyonder-api:ci backend

  frontend-links:
    name: No raw internal links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The site is served from a sub-path on GitHub Pages. next/link prefixes
      # basePath; a plain <a href="/..."> does not, so it 404s in production
      # while working perfectly in local dev.
      - name: Check for raw internal anchors
        run: |
          if grep -rnE '<a href=("|\{`)/' frontend/app frontend/components; then
            echo "::error::Internal links must use next/link, not <a href>, or they lose the base path."
            exit 1
          fi
          echo "No raw internal anchors."
